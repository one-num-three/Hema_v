<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="160" height="90" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 90" fill="none" stroke="#F5F5F5" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Grid background -->
  <g id="bg-grid">
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>
  
  <!-- Main content -->
  <g id="closing-content">
    <!-- Bold frame -->
    <rect x="300" y="250" width="680" height="220" fill="none" stroke="#000000" stroke-width="6"/>
    
    <!-- Pixel-style corner brackets (top-left) -->
    <path d="M 280 230 L 280 250 L 300 250 M 280 230 L 300 230" stroke="#000000" stroke-width="4" fill="none"/>
    
    <!-- Pixel-style corner brackets (top-right) -->
    <path d="M 1000 230 L 980 230 L 980 250 M 1000 230 L 1000 250" stroke="#000000" stroke-width="4" fill="none"/>
    
    <!-- Pixel-style corner brackets (bottom-left) -->
    <path d="M 280 490 L 280 470 L 300 470 M 280 490 L 300 490" stroke="#000000" stroke-width="4" fill="none"/>
    
    <!-- Pixel-style corner brackets (bottom-right) -->
    <path d="M 1000 490 L 980 490 L 980 470 M 1000 490 L 1000 470" stroke="#000000" stroke-width="4" fill="none"/>
    
    <!-- Main text -->
    <text x="640" y="340" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="96" font-weight="bold" fill="#000000" text-anchor="middle">THANK YOU</text>
    
    <!-- Subtitle -->
    <text x="640" y="420" font-family="Inter, 'Microsoft YaHei', Arial, sans-serif" font-size="48" fill="#666666" text-anchor="middle">Questions?</text>
  </g>
  
  <!-- Footer decoration -->
  <g id="footer-decoration">
    <circle cx="640" cy="580" r="8" fill="#000000"/>
  </g>
</svg>