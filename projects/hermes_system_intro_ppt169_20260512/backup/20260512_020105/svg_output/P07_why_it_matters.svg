<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Page header -->
  <g id="header">
    <text x="60" y="80" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000">Why It Matters</text>
    <line x1="60" y1="100" x2="380" y2="100" stroke="#000000" stroke-width="4"/>
  </g>
  
  <!-- Top divider -->
  <g id="top-divider">
    <line x1="200" y1="200" x2="1080" y2="200" stroke="#CCCCCC" stroke-width="2"/>
  </g>
  
  <!-- Main statement (large, centered) -->
  <g id="main-statement">
    <text x="640" y="300" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="600" fill="#000000" text-anchor="middle">Hermes represents the evolution</text>
    <text x="640" y="370" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="600" fill="#000000" text-anchor="middle">from <tspan font-weight="bold">chatbot</tspan> to</text>
    <text x="640" y="440" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000" text-anchor="middle">intelligent assistant.</text>
  </g>
  
  <!-- Bottom divider -->
  <g id="bottom-divider">
    <line x1="200" y1="520" x2="1080" y2="520" stroke="#CCCCCC" stroke-width="2"/>
  </g>
  
  <!-- Supporting points -->
  <g id="supporting-points">
    <text x="300" y="580" font-family="Inter, 'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#666666">• Automates complex workflows</text>
    <text x="640" y="580" font-family="Inter, 'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#666666">• Learns from experience</text>
    <text x="940" y="580" font-family="Inter, 'Microsoft YaHei', Arial, sans-serif" font-size="24" fill="#666666">• Scales human capability</text>
  </g>
</svg>