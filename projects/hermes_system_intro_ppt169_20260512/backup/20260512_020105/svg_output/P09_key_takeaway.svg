<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Page header -->
  <g id="header">
    <text x="60" y="80" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000">Key Takeaway</text>
    <line x1="60" y1="100" x2="340" y2="100" stroke="#000000" stroke-width="4"/>
  </g>
  
  <!-- Frame decoration -->
  <g id="frame">
    <rect x="150" y="200" width="980" height="320" fill="none" stroke="#000000" stroke-width="4"/>
    
    <!-- Corner brackets (top-left) -->
    <path d="M 130 180 L 130 200 L 150 200 M 130 180 L 150 180" stroke="#000000" stroke-width="3" fill="none"/>
    
    <!-- Corner brackets (top-right) -->
    <path d="M 1150 180 L 1130 180 L 1130 200 M 1150 180 L 1150 200" stroke="#000000" stroke-width="3" fill="none"/>
    
    <!-- Corner brackets (bottom-left) -->
    <path d="M 130 540 L 130 520 L 150 520 M 130 540 L 150 540" stroke="#000000" stroke-width="3" fill="none"/>
    
    <!-- Corner brackets (bottom-right) -->
    <path d="M 1150 540 L 1130 540 L 1130 520 M 1150 540 L 1150 520" stroke="#000000" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Core definition (extra large) -->
  <g id="definition">
    <text x="640" y="300" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="600" fill="#000000" text-anchor="middle">Hermes Agent is an AI system that</text>
    <text x="640" y="370" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000" text-anchor="middle">thinks, uses tools,</text>
    <text x="640" y="440" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000" text-anchor="middle">accumulates experience,</text>
    <text x="640" y="510" font-family="Montserrat, 'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000" text-anchor="middle">and continuously grows.</text>
  </g>
</svg>