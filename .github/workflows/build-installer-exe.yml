name: Build Hermes Installer EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer_gui.ps1'
      - 'installer_gui.bat'
      - 'install.bat'
      - 'start_webui.bat'
      - 'start_hermes_gateway.bat'
      - 'stop_webui.bat'
      - 'scripts/**'
      - 'cdn/version.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/installer/**'
      - '.github/workflows/build-installer-exe.yml'

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert PS1 to EXE
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser
          Invoke-ps2exe -inputFile installer_gui.ps1 -outputFile 安装Hermes.exe -title "Hermes 安装器" -noConsole
          Copy-Item 安装Hermes.exe HermesSetup.exe -Force
          $size = [math]::Round((Get-Item 安装Hermes.exe).Length / 1KB, 1)
          Write-Host "Built: 安装Hermes.exe ($size KB)"
          Write-Host "Built alias: HermesSetup.exe"

      - name: Verify CDN upload config
        shell: pwsh
        env:
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
          CDN_USER: ${{ secrets.CDN_USER }}
          CDN_HOST: ${{ secrets.CDN_HOST }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:CDN_SSH_KEY)) { $missing += 'CDN_SSH_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:CDN_USER)) { $missing += 'CDN_USER' }
          if ([string]::IsNullOrWhiteSpace($env:CDN_HOST)) { $missing += 'CDN_HOST' }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions secrets: $($missing -join ', '). CDN upload cannot run."
          }
          if (-not (Test-Path 安装Hermes.exe)) { throw "安装Hermes.exe was not built." }
          if (-not (Test-Path HermesSetup.exe)) { throw "HermesSetup.exe alias was not built." }

      - name: Upload to CDN
        shell: pwsh
        env:
          CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
          CDN_USER: ${{ secrets.CDN_USER }}
          CDN_HOST: ${{ secrets.CDN_HOST }}
        run: |
          $keyFile = "$env:TEMP\cdn_key"
          $env:CDN_SSH_KEY | Set-Content $keyFile -Encoding ASCII
          icacls $keyFile /inheritance:r /grant:r "$env:USERNAME:(R)" 2>$null

          $sshOpts = "-o StrictHostKeyChecking=no -i $keyFile"
          $cdnPath = "/var/www/hermes-cdn/files"

          scp $sshOpts.Split(' ') 安装Hermes.exe "${env:CDN_USER}@${env:CDN_HOST}:${cdnPath}/"
          scp $sshOpts.Split(' ') HermesSetup.exe "${env:CDN_USER}@${env:CDN_HOST}:${cdnPath}/"
          ssh $sshOpts.Split(' ') "${env:CDN_USER}@${env:CDN_HOST}" "ls -lh ${cdnPath}/安装Hermes.exe ${cdnPath}/HermesSetup.exe"
          Remove-Item $keyFile -Force
          Write-Host "Uploaded to CDN"
