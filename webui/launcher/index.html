<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>河马正在启动</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(37, 99, 235, .18), transparent 26%),
        radial-gradient(circle at 82% 20%, rgba(14, 116, 144, .16), transparent 24%),
        linear-gradient(145deg, #f8fbff 0%, #eef5fb 48%, #e8eef6 100%);
      color: #10233a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      position: relative;
      overflow: hidden;
      width: min(760px, calc(100vw - 32px));
      padding: 30px 30px 24px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.84));
      border: 1px solid rgba(148,163,184,.22);
      box-shadow: 0 30px 80px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.6);
      backdrop-filter: blur(18px);
    }
    .card:before {
      content: "";
      position: absolute;
      inset: -30% auto auto -10%;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(37,99,235,.18), transparent 68%);
      filter: blur(8px);
      animation: float 4.8s ease-in-out infinite;
    }
    .card:after {
      content: "";
      position: absolute;
      right: -40px;
      top: -46px;
      width: 170px;
      height: 170px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(15,118,110,.16), transparent 70%);
      filter: blur(8px);
      animation: float 5.6s ease-in-out infinite reverse;
    }
    .row { position: relative; display: flex; align-items: center; gap: 18px; }
    .logo {
      position: relative;
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      border-radius: 28px;
      background: linear-gradient(145deg, #0f172a 0%, #163760 42%, #1d4ed8 100%);
      box-shadow: 0 18px 40px rgba(29,78,216,.28), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .logo:before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 32px;
      background: conic-gradient(from 180deg, rgba(37,99,235,0) 0deg, rgba(37,99,235,.46) 90deg, rgba(14,116,144,.5) 210deg, rgba(37,99,235,0) 360deg);
      filter: blur(10px);
      animation: spin 4.2s linear infinite;
    }
    .logo:after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 27px;
      border: 1px solid rgba(255,255,255,.14);
    }
    .mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -.06em;
      color: #f8fbff;
    }
    .pulse {
      position: absolute;
      inset: -10px;
      border-radius: 36px;
      border: 1px solid rgba(37,99,235,.18);
      animation: pulse 2.4s ease-out infinite;
    }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #4f6b8f; }
    .title { margin-top: 10px; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -.05em; color: #10233a; }
    .text { margin-top: 22px; font-size: 28px; line-height: 1.45; color: #51657e; min-height: 40px; }
    .meta {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      font-size: 18px;
      color: #70829a;
    }
    .stage { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; color: #21466b; }
    .dot { width: 14px; height: 14px; border-radius: 999px; background: linear-gradient(145deg, #2563eb, #0f766e); box-shadow: 0 0 0 10px rgba(37,99,235,.10); }
    .progress { position: relative; margin-top: 18px; height: 12px; border-radius: 999px; background: rgba(148,163,184,.16); overflow: hidden; }
    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 18%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb 0%, #0f766e 52%, #60a5fa 100%);
      box-shadow: 0 0 18px rgba(37,99,235,.28);
      transition: width .45s ease;
    }
    .bar:after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.72), rgba(255,255,255,0));
      animation: sheen 1.8s linear infinite;
    }
    .foot { margin-top: 16px; font-size: 18px; color: #789; }
    .diag {
      margin-top: 28px;
      padding: 20px 24px;
      background: rgba(148,163,184,.08);
      border-radius: 22px;
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 10px 18px;
      align-items: baseline;
    }
    .diag-k { color: #8398b0; font-size: 18px; }
    .diag-v { font-size: 18px; font-weight: 700; color: #94a3b8; }
    .diag-v.ok { color: #16a34a; }
    .diag-v.wait { color: #d97706; }
    .diag-v.err { color: #dc2626; }
    .details {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(15,23,42,.04);
      color: #54657d;
      font-size: 15px;
      line-height: 1.6;
    }
    .details strong { color: #203755; }
    .raw {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #7a2f2f;
    }
    .actions { margin-top: 22px; display: flex; gap: 14px; justify-content: flex-end; }
    .actions button {
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
      background: rgba(37,99,235,.10);
      color: #143a66;
      box-shadow: 0 8px 20px rgba(15,23,42,.08);
    }
    .actions button.primary {
      background: linear-gradient(90deg, #2563eb, #0f766e);
      color: #fff;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0% { transform: scale(.92); opacity: .22; }
      60% { transform: scale(1.06); opacity: .10; }
      100% { transform: scale(1.14); opacity: 0; }
    }
    @keyframes sheen { to { transform: translateX(180%); } }
    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, 10px, 0); }
    }
    @media (max-width: 900px) {
      .card { width: min(100vw - 24px, 760px); padding: 24px 20px 20px; border-radius: 24px; }
      .row { align-items: flex-start; }
      .logo { width: 68px; height: 68px; flex-basis: 68px; border-radius: 20px; }
      .mark { font-size: 30px; }
      .title { font-size: 44px; }
      .text { font-size: 22px; }
      .meta, .foot, .diag-k, .diag-v, .actions button { font-size: 16px; }
      .diag { grid-template-columns: 120px 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="logo" aria-hidden="true">
        <div class="pulse"></div>
        <div class="mark">H</div>
      </div>
      <div>
        <div class="kicker">HERMES WEB UI</div>
        <div class="title">正在启动控制台</div>
        <div class="text" id="statusText">正在连接本地服务…</div>
      </div>
    </div>
    <div class="meta">
      <div class="stage"><span class="dot"></span><span id="stageText">初始化连接</span></div>
      <div id="percentText">18%</div>
    </div>
    <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <div class="foot" id="footText">浏览器已经打开，后台正在继续启动。</div>
    <div class="diag">
      <div class="diag-k">已等待</div><div class="diag-v" id="diagElapsed">0 秒</div>
      <div class="diag-k">Web UI :8648</div><div class="diag-v" id="diagWebui">检测中…</div>
      <div class="diag-k" id="diagGwLabel">网关 :8642</div><div class="diag-v" id="diagGw">检测中…</div>
      <div class="diag-k">最近错误</div><div class="diag-v" id="diagErr">暂无</div>
    </div>
    <div class="details">
      <strong>技术提示</strong>
      <div id="detailText">短暂的 timeout 或“远程连接被关闭”通常只是服务刚启动或正在重启，页面会自动继续检测。</div>
      <div class="raw" id="rawError">暂无原始错误</div>
    </div>
    <div class="actions">
      <button type="button" id="retryBtn">重新检测</button>
      <button type="button" class="primary" id="enterBtn">直接进入</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const targetPort = Number(params.get("targetPort") || "8648");
    const gatewayPort = Number(params.get("gatewayPort") || "8642");
    const targetHost = (location.hostname && location.hostname !== "localhost")
      ? location.hostname
      : "127.0.0.1";
    const targetUrl = `http://${targetHost}:${targetPort}/#/hermes/chat`;
    const origin = (location.origin && location.origin !== "null") ? location.origin : null;
    const probeUrl = origin
      ? `${origin}/__probe__?targetPort=${encodeURIComponent(String(targetPort))}&gatewayPort=${encodeURIComponent(String(gatewayPort))}&ts=`
      : null;

    const stages = {
      boot: ["正在连接本地服务…", 18, "浏览器已经打开，后台正在继续启动。"],
      webui: ["正在唤起本地服务…", 34, "正在等待 Web UI 监听 8648 端口。"],
      connect: ["Web UI 已就绪，正在等待网关…", 62, "你已经可以直接进入页面；左下角连接状态会稍后变成已连接。"],
      restore: ["正在恢复会话…", 82, "本地页面已经准备好，正在等待网关完全接通。"],
      ready: ["即将进入控制台…", 96, "检测到服务可用，马上进入 Web 管理界面。"],
      slow: ["首次启动稍慢一点…", 72, "新机器第一次启动可能需要 1 到 3 分钟，请再等一会。"],
      fail: ["本地服务还在启动", 52, "启动比预期更慢，但页面会继续自动检测。"],
    };

    const text = document.getElementById("statusText");
    const stage = document.getElementById("stageText");
    const percent = document.getElementById("percentText");
    const bar = document.getElementById("bar");
    const foot = document.getElementById("footText");
    const enterBtn = document.getElementById("enterBtn");
    const retryBtn = document.getElementById("retryBtn");
    const diagElapsed = document.getElementById("diagElapsed");
    const diagWebui = document.getElementById("diagWebui");
    const diagGwLabel = document.getElementById("diagGwLabel");
    const diagGw = document.getElementById("diagGw");
    const diagErr = document.getElementById("diagErr");
    const detailText = document.getElementById("detailText");
    const rawError = document.getElementById("rawError");

    const startTime = Date.now();
    let attempts = 0;
    let redirected = false;

    function goTarget(delayMs = 0) {
      if (redirected) return;
      redirected = true;
      const jump = () => {
        try {
          location.replace(targetUrl);
        } catch (_) {
          try {
            location.href = targetUrl;
          } catch (_) {}
        }
        setTimeout(() => {
          if (location.href !== targetUrl) {
            try {
              location.href = targetUrl;
            } catch (_) {}
          }
        }, 220);
      };
      if (delayMs > 0) {
        setTimeout(jump, delayMs);
      } else {
        jump();
      }
    }

    let slowMode = false;
    let slowAttempts = 0;
    let lastRawError = "";

    const FAST_INTERVAL = 450;
    const SLOW_INTERVAL = 3000;
    const MAX_WEBUI_ATTEMPTS = 70;
    const MAX_FAST_GATEWAY = 120;
    const MAX_SLOW_GATEWAY = 80;

    diagGwLabel.textContent = `网关 :${gatewayPort}`;

    function elapsed() {
      const s = Math.floor((Date.now() - startTime) / 1000);
      return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${s % 60} 秒`;
    }

    function setV(el, cls, txt) {
      el.className = `diag-v${cls ? " " + cls : ""}`;
      el.textContent = txt;
    }

    function isStuck() {
      return attempts >= MAX_WEBUI_ATTEMPTS || (slowMode && slowAttempts >= MAX_SLOW_GATEWAY);
    }

    function paint(label, value, footnote) {
      text.textContent = label;
      stage.textContent = label;
      percent.textContent = `${value}%`;
      bar.style.width = `${value}%`;
      foot.textContent = footnote;
    }

    function classifyError(message) {
      const raw = String(message || "").trim();
      if (!raw) return { transient: false, friendly: "暂无错误" };
      const lower = raw.toLowerCase();
      if (
        lower.includes("timed out") ||
        lower.includes("timeout") ||
        lower.includes("remote end closed") ||
        lower.includes("remotedisconnected") ||
        lower.includes("connection reset") ||
        lower.includes("forcibly closed") ||
        lower.includes("target machine actively refused")
      ) {
        return {
          transient: true,
          friendly: "本地服务正在启动或切换进程，已自动继续重试。",
        };
      }
      return {
        transient: false,
        friendly: "检测到一个可用于排障的技术错误，请查看下面原始信息。",
      };
    }

    function updateDiagnostics(data, errMsg) {
      diagElapsed.textContent = elapsed();
      const stuck = isStuck();

      if (!data) {
        setV(diagWebui, stuck ? "err" : "wait", `等待中…（已检测 ${attempts} 次）`);
        setV(diagGw, "wait", "检测中…");
      } else {
        if (data.webui_up) {
          const sourceText = data.webui_source === "root" ? "首页可达" : "健康检查可达";
          setV(diagWebui, "ok", `已就绪（${sourceText}）`);
        } else {
          setV(diagWebui, stuck ? "err" : "wait", `等待中…（已检测 ${attempts} 次）`);
        }

        if (data.gateway_running) {
          setV(diagGw, "ok", "已连接");
        } else if (data.gateway_direct) {
          setV(diagGw, "wait", "网关已启动，等待 Web UI 完成连接…");
        } else {
          setV(diagGw, "wait", "启动中 / 未连接");
        }
      }

      if (errMsg) {
        const info = classifyError(errMsg);
        const hard = !info.transient || stuck;
        setV(diagErr, hard ? "err" : "wait", hard ? "需要排障" : "短暂波动，已自动重试");
        detailText.textContent = info.friendly;
        rawError.textContent = errMsg;
      } else if (lastRawError) {
        const info = classifyError(lastRawError);
        const hard = !info.transient || stuck;
        setV(diagErr, hard ? "err" : "wait", hard ? "最近有技术错误" : "最近有短暂波动");
        detailText.textContent = info.friendly;
        rawError.textContent = lastRawError;
      } else {
        setV(diagErr, "", "暂无");
        detailText.textContent = "短暂的 timeout 或“远程连接被关闭”通常只是服务刚启动或正在重启，页面会自动继续检测。";
        rawError.textContent = "暂无原始错误";
      }
    }

    async function probe() {
      if (redirected) return;
      attempts += 1;
      if (slowMode) slowAttempts += 1;

      if (!probeUrl) {
        paint("启动页来源不正确", 12, "请通过 start_webui.bat 启动，而不是直接双击这个 HTML 文件。");
        lastRawError = "当前页面不是通过本地 launcher 服务打开，无法执行探测。";
        updateDiagnostics(null, lastRawError);
        return;
      }

      try {
        const response = await fetch(probeUrl + Date.now(), { cache: "no-store" });
        const data = await response.json();
        const currentError = data.error || "";
        if (currentError) lastRawError = currentError;

        updateDiagnostics(data, currentError || "");

        if (data.webui_up) {
          const nextStage = data.gateway_running
            ? stages.ready
            : (attempts > 2 ? stages.restore : stages.connect);
          paint(...nextStage);
          goTarget(data.gateway_running ? 120 : 220);
          return;
        }

        if (!slowMode && attempts >= MAX_FAST_GATEWAY) {
          slowMode = true;
          paint(...stages.slow);
        } else if (slowMode && slowAttempts >= MAX_SLOW_GATEWAY) {
          paint(...stages.fail);
        } else if (attempts >= MAX_WEBUI_ATTEMPTS) {
          paint("还没检测到 8648", 42, "Web UI 仍未监听 8648。请检查安装目录、Node 依赖，或查看 server.log。");
        } else {
          paint(...(attempts > 3 ? stages.webui : stages.boot));
        }
      } catch (error) {
        lastRawError = error?.message || String(error) || "launcher 无响应";
        updateDiagnostics(null, lastRawError);

        if (attempts >= MAX_WEBUI_ATTEMPTS) {
          paint("本地服务尚未启动", 42, "仍未连到 8648。常见原因是安装目录不对，或当前目录缺少 node_embedded / webui。");
        } else if (slowMode) {
          paint(...stages.slow);
        } else {
          paint(...(attempts > 6 ? stages.fail : stages.boot));
        }
      }

      setTimeout(probe, slowMode ? SLOW_INTERVAL : FAST_INTERVAL);
    }

    enterBtn.addEventListener("click", () => {
      redirected = false;
      goTarget(0);
    });

    retryBtn.addEventListener("click", () => {
      attempts = 0;
      slowAttempts = 0;
      slowMode = false;
      lastRawError = "";
      redirected = false;
      paint(...stages.boot);
      updateDiagnostics(null, "");
      setTimeout(probe, 80);
    });

    paint(...stages.boot);
    updateDiagnostics(null, "");
    window.addEventListener("beforeunload", () => {
      redirected = true;
    });
    setInterval(() => {
      if (!redirected) diagElapsed.textContent = elapsed();
    }, 1000);
    setTimeout(probe, 120);
  </script>
</body>
</html>
